spring:
  application:
    name: military-asset-management-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/military_asset_management?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    hibernate:
      # The schema is owned by database\military_asset_management.sql. Hibernate
      # only validates the mapping against it and never alters it, so a restart
      # cannot silently drop or rewrite production data.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 100
        order_inserts: true
        order_updates: true
        format_sql: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
  sql:
    init:
      mode: never

server:
  # Render injects PORT, so the default has to fall back to it when present.
  port: ${SERVER_PORT:${PORT:8080}}
  error:
    include-message: never
    include-stacktrace: never
  forward-headers-strategy: framework

app:
  jwt:
    secret: ${JWT_SECRET:militaryAssetManagementSuperSecretKeyChangeMeInProduction2026_0123456789}
    expiration-ms: ${JWT_EXPIRATION_MS:43200000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000}
    # Optional wildcard patterns, e.g. https://*.vercel.app, so Vercel preview
    # deployments are accepted without changing the environment.
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:}
  bootstrap:
    enabled: ${BOOTSTRAP_ENABLED:true}
    admin-username: ${DEFAULT_ADMIN_USERNAME:admin}
    admin-password: ${DEFAULT_ADMIN_PASSWORD:admin123}

logging:
  file:
    name: ${LOG_FILE:logs/app.log}
  level:
    org.hibernate.SQL: OFF
    com.military.ams: INFO
